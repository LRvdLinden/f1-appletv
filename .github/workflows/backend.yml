name: Backend

# Zet de Pitwall-accounts in Supabase klaar: schema (supabase/schema.sql), auth-instellingen
# (redirects naar de app) en de Edge Function device-auth.
# Repo-secrets: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens) en
# SUPABASE_PROJECT_REF (bv. abcd1234 uit https://abcd1234.supabase.co).
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - name: Controleren
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN of SUPABASE_PROJECT_REF ontbreekt — backend niet bijgewerkt."
            echo "skip=1" >> $GITHUB_OUTPUT
          fi

      - name: Database-schema
        if: steps.check.outputs.skip != '1'
        run: |
          python3 -c 'import json;print(json.dumps({"query":open("supabase/schema.sql").read()}))' > /tmp/q.json
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          cat /tmp/r.txt; echo; [ "$code" -lt 300 ] || { echo "::error::Schema mislukt (HTTP $code)"; exit 1; }

      - name: Auth-instellingen (redirects naar de app)
        if: steps.check.outputs.skip != '1'
        run: |
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data '{"site_url":"pitwall://confirmed","uri_allow_list":"pitwall://**","mailer_secure_email_change_enabled":true,"password_min_length":6}')
          [ "$code" -lt 300 ] && echo "::notice::Auth-instellingen bijgewerkt" || { head -c 400 /tmp/r.txt; echo "::error::Auth-instellingen mislukt (HTTP $code)"; exit 1; }

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != '1'
        with:
          version: latest

      - name: Versleutelsleutel
        if: steps.check.outputs.skip != '1'
        run: |
          # alleen aanmaken als hij nog niet bestaat (nooit vervangen, anders zijn opgeslagen gegevens onleesbaar)
          if ! supabase secrets list --project-ref "$REF" 2>/dev/null | grep -q PITWALL_STATE_KEY; then
            supabase secrets set --project-ref "$REF" PITWALL_STATE_KEY="$(openssl rand -base64 32)" >/dev/null
            echo "::notice::Versleutelsleutel aangemaakt"
          fi

      - name: Edge Function device-auth
        if: steps.check.outputs.skip != '1'
        run: supabase functions deploy device-auth --project-ref "$REF" --no-verify-jwt --use-api

      - name: Testen
        if: steps.check.outputs.skip != '1'
        run: |
          sleep 5
          F="https://$REF.supabase.co/functions/v1/device-auth"
          curl -s -X POST "$F" -H "Content-Type: application/json" -d '{"action":"start","device":"CI-test"}' > /tmp/s.json; cat /tmp/s.json; echo
          C=$(python3 -c 'import json;print(json.load(open("/tmp/s.json")).get("code",""))')
          P=$(python3 -c 'import json;print(json.load(open("/tmp/s.json")).get("poll_secret",""))')
          [ -n "$C" ] || { echo "::error::start gaf geen code"; exit 1; }
          curl -s -X POST "$F" -H "Content-Type: application/json" -d "{\"action\":\"poll\",\"code\":\"$C\",\"poll_secret\":\"$P\"}" | tee /tmp/p.json; echo
          grep -q pending /tmp/p.json && echo "::notice::tv-koppeling werkt (code $C)" || { echo "::error::poll gaf geen pending"; exit 1; }
          curl -s -X POST "$F" -H "Content-Type: application/json" -d '{"action":"list_devices"}' | tee /tmp/l.json; echo
          grep -q not_signed_in /tmp/l.json && echo "::notice::apparatenbeheer actief" || { echo "::error::list_devices onverwacht"; exit 1; }
