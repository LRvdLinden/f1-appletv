name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: tvOS
            destination: generic/platform=tvOS Simulator
          - platform: macOS
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install ${{ matrix.platform }} platform if missing
        if: matrix.platform != 'macOS'
        run: |
          if ! xcodebuild -showsdks | grep -qi "${{ matrix.platform }} Simulator"; then
            xcodebuild -downloadPlatform ${{ matrix.platform }}
          fi

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pitwall.xcodeproj \
            -scheme Pitwall \
            -configuration Debug \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*(isolat|Sendable)|BUILD (SUCCEEDED|FAILED)" || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            # Surface the first compiler errors as one annotation (readable via the API).
            ERRORS=$(grep -E "error:|fatal" build.log | grep -v "^note:" | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -60)
            [ -z "$ERRORS" ] && ERRORS=$(tail -40 build.log)
            ERRORS="${ERRORS//'%'/'%25'}"; ERRORS="${ERRORS//$'\n'/'%0A'}"
            echo "::error title=${{ matrix.platform }} build failed::$ERRORS"
            exit 1
          fi

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: build.log
